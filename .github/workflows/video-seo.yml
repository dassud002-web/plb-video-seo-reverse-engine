name: Video SEO Reverse Engineering

on:
  push:
    branches: [ main, master ]
    paths:
      - 'input/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/video-seo.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'input/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/video-seo.yml'
  workflow_dispatch:

jobs:
  analyze-video:
    runs-on: ubuntu-latest
    name: Run Video Reverse Engineering

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & FFprobe)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Target Video Exists
        run: |
          if [ ! -f "input/target.mp4" ]; then
            echo "::error::Target video 'input/target.mp4' does not exist!"
            echo "--------------------------------------------------------"
            echo "ACTION REQUIRED:"
            echo "1. Copy your video to: input/target.mp4"
            echo "2. Run: git add input/target.mp4"
            echo "3. Run: git commit -m 'feat: analyze new video'"
            echo "4. Run: git push"
            echo "--------------------------------------------------------"
            exit 1
          fi
          echo "Target video confirmed: input/target.mp4"

      - name: Run Reverse Engineering Engine
        run: |
          python scripts/video_seo_reverse_engineer.py \
            --video input/target.mp4 \
            --output VIDEO-SEO-REVERSE-ENGINEERING-REPORT.md

      - name: Verify Report Generated
        run: |
          if [ ! -f "VIDEO-SEO-REVERSE-ENGINEERING-REPORT.md" ]; then
            echo "::error::VIDEO-SEO-REVERSE-ENGINEERING-REPORT.md was not generated!"
            exit 1
          fi
          echo "Generated report preview:"
          head -n 40 VIDEO-SEO-REVERSE-ENGINEERING-REPORT.md

      - name: Upload Investigation Report
        uses: actions/upload-artifact@v4
        with:
          name: video-seo-reverse-engineering-report
          path: VIDEO-SEO-REVERSE-ENGINEERING-REPORT.md
          if-no-files-found: error

      - name: Upload Extracted Keyframes (If Generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extracted-keyframes
          path: input/target_frames/*.jpg
          if-no-files-found: ignore
